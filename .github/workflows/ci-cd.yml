name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: college_recommendation_chatbot/requirements*.txt

      - name: Install dependencies
        run: pip install -r college_recommendation_chatbot/requirements-dev.txt

      - name: Lint (syntax errors and undefined names)
        run: flake8 college_recommendation_chatbot --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        run: pytest -v --cov=college_recommendation_chatbot --cov-report=term-missing
