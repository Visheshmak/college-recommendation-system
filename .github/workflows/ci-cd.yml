name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r college_recommendation_chatbot/requirements.txt
        pip install -r college_recommendation_chatbot/requirements-dev.txt
    
    - name: Lint with Flake8
      run: |
        flake8 college_recommendation_chatbot --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 college_recommendation_chatbot --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest college_recommendation_chatbot/tests/ -v --cov=college_recommendation_chatbot --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r college_recommendation_chatbot/ -ll
      continue-on-error: true
    
    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r college_recommendation_chatbot/requirements.txt
        safety check --json
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint black autopep8
    
    - name: Check code formatting with Black
      run: |
        black --check college_recommendation_chatbot/ --diff
      continue-on-error: true
    
    - name: Run Pylint
      run: |
        pylint college_recommendation_chatbot/ --exit-zero --disable=all --enable=E,F,W
      continue-on-error: true
