{% extends "base.html" %}

{% block title %}Chatbot Demo | College Guide{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg">
                <div class="card-body">

                    <h4 class="text-center mb-3">
                        🤖 College Enquiry Chatbot Demo
                    </h4>

                    <p class="text-center text-muted mb-4">
                        Try asking about fees, placements, hostel, or admission!
                    </p>

                    <!-- QUICK QUESTION BUTTONS -->
                    <div class="mb-3 text-center">
                        <span class="badge bg-primary me-2 quick-btn" onclick="sendQuick('fees')">Fees</span>
                        <span class="badge bg-success me-2 quick-btn" onclick="sendQuick('placements')">Placements</span>
                        <span class="badge bg-warning text-dark me-2 quick-btn" onclick="sendQuick('hostel')">Hostel</span>
                        <span class="badge bg-info text-dark me-2 quick-btn" onclick="sendQuick('admission')">Admission</span>
                    </div>

                    <!-- BOT REPLY -->
                    {% if reply %}
                    <div class="alert alert-info mt-3">
                        <p><strong>Bot:</strong> <span id="botText"></span></p>

                        <script>
                            const text = "{{ reply }}";
                            let i = 0;

                            function typeEffect() {
                                if (i < text.length) {
                                    document.getElementById("botText").innerHTML += text.charAt(i);
                                    i++;
                                    setTimeout(typeEffect, 25);
                                }
                            }
                            typeEffect();
                        </script>
                    {% endif %}

                    <!-- USER INPUT -->
                    <form method="post" class="mt-3">
                        <input type="text"
                               id="message"
                               name="message"
                               class="form-control"
                               placeholder="Ask about fees, placements, hostel..."
                               required>

                        <div class="d-grid mt-2">
                            <button class="btn btn-primary">
                                Send
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/" class="btn btn-link">⬅ Back to Home</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function sendQuick(text) {
        document.getElementById("message").value = text;
        document.getElementById("message").focus();
    }
</script>

{% endblock %}
