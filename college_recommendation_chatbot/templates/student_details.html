{% extends "base.html" %}
{% block title %}Student Details{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-2">Student Login & Details</h3>
                <p class="text-center text-muted mb-4">
                    Please fill your details to get personalized college recommendations
                </p>

                <form method="post" action="/recommend">

                    <!-- Name -->
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control"
                               name="name" placeholder="Enter your full name" 
                               value="{{ student_data.get('name', '') }}" required>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               name="email" placeholder="example@gmail.com" 
                               value="{{ student_data.get('email', '') }}" required>
                    </div>

                    <!-- Exam Type -->
                    <div class="form-group">
                        <label class="form-label">Exam Type</label>
                        <select id="examTypeSelect" class="form-control" name="exam_type" required>
                            <option value="">Select Exam</option>
                            <option value="MHT-CET" {% if student_data.get('exam_type') == 'MHT-CET' %}selected{% endif %}>MHT-CET</option>
                            <option value="JEE Main" {% if student_data.get('exam_type') == 'JEE Main' %}selected{% endif %}>JEE Main</option>
                            <option value="JEE Advanced" {% if student_data.get('exam_type') == 'JEE Advanced' %}selected{% endif %}>JEE Advanced</option>
                        </select>
                    </div>

                    <!-- Percentile / Score -->
                    <div class="form-group">
                        <label id="scoreLabel" class="form-label">Exam Percentile / Score</label>
                        <input id="scoreInput" type="number" step="0.01" class="form-control"
                               name="percentile" placeholder="e.g. 92.45 or 250" 
                               value="{{ student_data.get('percentile', '') }}" required>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-control" name="category" required>
                            <option value="">Select Category</option>
                            <option {% if student_data.get('category') == 'OPEN' %}selected{% endif %}>OPEN</option>
                            <option {% if student_data.get('category') == 'OBC' %}selected{% endif %}>OBC</option>
                            <option {% if student_data.get('category') == 'SC' %}selected{% endif %}>SC</option>
                            <option {% if student_data.get('category') == 'ST' %}selected{% endif %}>ST</option>
                            <option {% if student_data.get('category') == 'VJNT' %}selected{% endif %}>VJNT</option>
                        </select>
                    </div>

                    <!-- Branch -->
                    <div class="form-group">
                        <label class="form-label">Preferred Branch</label>
                        <select class="form-control" name="branch" required>
                            <option value="">Select Branch</option>
                            <option {% if student_data.get('branch') == 'Computer Engineering' %}selected{% endif %}>Computer Engineering</option>
                            <option {% if student_data.get('branch') == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                            <option {% if student_data.get('branch') == 'AI & DS' %}selected{% endif %}>AI & DS</option>
                            <option {% if student_data.get('branch') == 'Electronics' %}selected{% endif %}>Electronics</option>
                            <option {% if student_data.get('branch') == 'Mechanical' %}selected{% endif %}>Mechanical</option>
                        </select>
                    </div>

                    <!-- City -->
                    <div class="form-group">
                        <label class="form-label">Preferred City (Optional)</label>
                        <select class="form-control" name="city">
                            <option value="">-- Select City (Optional) --</option>
                            {% for city in cities %}
                                <option value="{{ city.lower() }}" {% if student_data.get('city') == city.lower() %}selected{% endif %}>{{ city }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Submit -->
                    <button class="btn btn-primary w-100">
                        🔍 Get College Recommendations
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>

<script>
    const examTypeSelect = document.getElementById('examTypeSelect');
    const scoreLabel = document.getElementById('scoreLabel');
    const scoreInput = document.getElementById('scoreInput');

    function updateScoreLabel() {
        const examType = examTypeSelect.value;
        if (examType === 'JEE Advanced') {
            scoreLabel.textContent = 'JEE Advanced Rank / Score';
            scoreInput.placeholder = 'e.g. 250 or 120';
            scoreInput.step = '1';
        } else if (examType === 'JEE Main') {
            scoreLabel.textContent = 'JEE Main Percentile / Score';
            scoreInput.placeholder = 'e.g. 95.00 or 250';
            scoreInput.step = '0.01';
        } else {
            scoreLabel.textContent = 'MHT-CET Percentile';
            scoreInput.placeholder = 'e.g. 92.45';
            scoreInput.step = '0.01';
        }
    }

    if (examTypeSelect) {
        examTypeSelect.addEventListener('change', updateScoreLabel);
        updateScoreLabel();
    }
</script>
{% endblock %}
