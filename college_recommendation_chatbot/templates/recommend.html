<!DOCTYPE html>
<html>
<head>
    <title>Find Colleges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h3 class="tex{% extends "base.html" %}
{% block title %}Find Colleges{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">Find Eligible Colleges</h3>

                <form method="post">

                    <div class="mb-3">
                        <label class="form-label">MHT-CET Percentile</label>
                        <input type="number" step="0.01" name="percentile"
                               class="form-control" placeholder="e.g. 92.45" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="">Select Category</option>
                            <option>OPEN</option>
                            <option>OBC</option>
                            <option>SC</option>
                            <option>ST</option>
                            <option>VJNT</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Preferred Branch</label>
                        <select name="branch" class="form-select" required>
                            <option value="">Select Branch</option>
                            <option>Computer Engineering</option>
                            <option>Information Technology</option>
                            <option>AI & DS</option>
                            <option>Electronics</option>
                            <option>Mechanical</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Preferred City</label>
                        <input type="text" name="city"
                               class="form-control" placeholder="e.g. Pune">
                    </div>

                    <button class="btn btn-primary w-100">
                        🔍 Recommend Colleges
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
