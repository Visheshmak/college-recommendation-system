{% extends "base.html" %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="error-container">
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="mb-3">Server Error</h2>
                <p class="lead text-muted mb-4">
                    Oops! Something went wrong on our end. We're working to fix it.
                </p>
                <div class="error-icon mb-4" style="font-size: 4rem;">
                    ⚠️
                </div>
                <p class="text-muted small mb-4">
                    Our team has been notified of this issue. Please try again later.
                </p>
                <a href="/" class="btn btn-primary btn-lg me-2">Go to Home</a>
                <a href="javascript:location.reload()" class="btn btn-secondary btn-lg">Retry</a>
            </div>
        </div>
    </div>
</div>

<style>
    .error-container {
        padding: 50px 20px;
        background: rgba(220, 53, 69, 0.05);
        border-radius: 10px;
        border: 2px solid rgba(220, 53, 69, 0.1);
        animation: fadeIn 0.5s ease-in-out;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
