{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="error-container">
                <h1 class="display-1 fw-bold text-danger">404</h1>
                <h2 class="mb-3">Page Not Found</h2>
                <p class="lead text-muted mb-4">
                    Sorry, the page you're looking for doesn't exist or has been moved.
                </p>
                <div class="error-icon mb-4" style="font-size: 4rem;">
                    🔍
                </div>
                <a href="/" class="btn btn-primary btn-lg me-2">Go to Home</a>
                <a href="/features" class="btn btn-secondary btn-lg">View Features</a>
            </div>
        </div>
    </div>
</div>

<style>
    .error-container {
        padding: 50px 20px;
        background: rgba(13, 110, 253, 0.05);
        border-radius: 10px;
        border: 2px solid rgba(13, 110, 253, 0.1);
        animation: fadeIn 0.5s ease-in-out;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}
